apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-node-manager
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: gpu-node-manager
  template:
    metadata:
      labels:
        app: gpu-node-manager
    spec:
      # Stateless Go binary: run unprivileged (Pod Security `restricted`).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: {{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          name: gpu-node-manager
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
          {{- if .Values.scaleDownDelay }}
            # Global idle time before a node is powered off (Go duration, e.g.
            # "2m"). Per-node scaleDownDelay below overrides this.
            - name: SCALE_DOWN_DELAY
              value: "{{ .Values.scaleDownDelay }}"
          {{- end }}
          {{- range .Values.nodeGroups }}
            - name: {{ .name | upper }}_GPU_COUNT
              value: "{{ .gpuCount }}"
            - name: {{ .name | upper }}_SCALE_UP_ENDPOINT
              value: "{{ .scaleUpEndpoint }}"
            - name: {{ .name | upper }}_SCALE_DOWN_ENDPOINT
              value: "{{ .scaleDownEndpoint }}"
            - name: {{ .name | upper }}_NAME
              value: "{{ .name }}"
          {{- if .scaleDownDelay }}
            - name: {{ .name | upper }}_SCALE_DOWN_DELAY
              value: "{{ .scaleDownDelay }}"
          {{- end }}
          {{- end }}
      serviceAccountName: gpu-node-manager